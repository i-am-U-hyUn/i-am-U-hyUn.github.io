  - title: "MBR(Monthly Business Review) 보고서 자동화"
    meta: "MegazoneCloud · Business Operations · PI 포털 확장 개발"
    description: >
      스프레드시트(과제 이력)·캘린더(회의 일정)·개별 문서(회의록)·설문 시트 네 곳에 흩어져 있던
      원자료를 사람이 매달 손으로 취합해 작성하던 월간 보고서(MBR) 작성을 자동화. 반복 작업을
      "집계"(건수·비율·분포), "전사"(일정·링크), "요약"(회의록→결론) 세 유형으로 나눠, 정답이
      명확한 집계·전사는 코드가 확정 출력하고 판단이 필요한 요약만 LLM에 맡기는 원칙을 세운 게
      설계의 핵심이다. 새 서버 없이 기존 PI 포털 Apps Script 웹앱에 `mode` 파라미터로 읽기 전용
      JSON 엔드포인트 4종(rows/calendar/minutes/survey)을 얹었고, 시트 셀에 하이퍼링크로만 걸린
      회의록 문서를 `getRichTextValues()`로 추출하고 캘린더 제목에서 정규식으로 안건 번호를 매핑해
      관련 회의록을 한 번에 모으는 구조를 짰다. 누적 이력에 폐기안·확정안이 섞여 최신 결론을
      잘못 판별하는 문제는 "회의록이 있으면 시트보다 우선"이라는 규칙으로, 안건별 재조회로 느렸던
      수집 속도는 캐싱과 병렬 처리로 해결했다. 결과적으로 4개 데이터 소스를 자동 연동해 수기 전사
      항목을 0건으로 줄였고, 월간 보고서 작성이 명령 한 줄로 실행되도록 만들었다.
    tags: ["Google Apps Script", "Vertex AI", Gemini, MBR]
    url: "/posts/mbr-report-automation-endpoints/"

  - title: "Sales Cycle Lead Time 분석 대시보드"
    meta: "MegazoneCloud · Business Operations · Databricks · 요청 기반 분석"
    description: >
      "영업 프로세스(DMS 사업성검토)가 실제로 어떻게 돌아가고 있는가"를 데이터로 밝혀달라는 요청을
      받아, 승인율·소요시간(리드타임)·마진율 세 축으로 나눠 SQL 분석 후 대시보드로 통합했다.
      승인율은 딜 등급(FAST_TRACK/STANDARD/COMPLEX)별로 갈라 봤고, 소요시간은 버전이 갱신될
      때마다 새 SEQ가 생기는 이력 테이블에서 최종 버전만 걸러내는 `NOT EXISTS` 체인, 1:N 조인으로
      인한 중복 집계를 막는 `EXISTS` 서브쿼리, 제출/완료 시각을 한 번의 스캔으로 뽑아내는 조건부
      집계(pivot) 패턴을 적용해 평균/중앙값/최대/최소를 함께 산출했다. 마진율은 사업모델(BM:
      INFRA/MS/PS/DS)마다 저장 테이블과 조인 키 이름이 전부 달라 7개 하위 테이블을 `COALESCE`로
      병합하고, -100% 이하(원가가 매출의 2배 이상)를 이상치로 정의해 평균 계산에서 제외했다 —
      실제 마진율 수치는 회사 수익 구조 직결 정보라 대시보드에만 반영하고 외부에는 전혀 공개하지
      않았다. 여기에 계약 반려 사유를 Gemini로 자동 분류하는 별도 파이프라인을 붙여 반려 메시지도
      같은 대시보드에서 카테고리별로 집계되게 했는데, 이 파이프라인은 스케줄링을 SEQ 기준에서 날짜
      기반으로 바꾸며 멱등성(재실행해도 결과가 같음)을 `MERGE ... ON` 키 매칭만으로 보장하도록
      설계했고, 한 번은 "재실행 대비"로 넣어둔 `DELETE`가 오히려 매일 데이터를 지우는 장애를 내서
      원인 분석 후 제거하고 스냅샷 기반으로 복구한 이력도 있다.
    tags: [Databricks, SQL, "Vertex AI", Gemini, "데이터분석"]
    url: "/posts/dms-review-approval-rate/"

