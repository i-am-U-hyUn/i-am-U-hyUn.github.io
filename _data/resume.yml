  - title: "프로세스 시각화 대시보드 (Architecture AI)"
    meta: "MegazoneCloud · Business Operations · 기획·설계·개발·배포 전담"
    description: >
      Word로 작성된 영업 프로세스 정의서(20개, macro 7단계 + detail 하위 그룹)를 업로드하면 사람이
      다시 그리지 않아도 표준 플로우차트(시작/끝·처리·판단·입출력)로 자동 렌더링되는 웹 대시보드.
      기존에는 프로세스가 바뀔 때마다 드로잉 툴로 그림을 처음부터 다시 그려야 해서 문서와 그림
      버전이 어긋나는 문제가 반복됐는데, 이를 근본적으로 없애는 게 목표였다. 그래프 조립·도형
      자동 판별(진입/진출 차수 + 키워드 기반)을 저장 시점이 아니라 조회 시점에 수행하는 ELT
      구조로 설계해 판별 로직이 바뀌어도 데이터 재적재가 불필요하게 했고, 저장 계층을 인터페이스로
      추상화해 MongoDB/lowdb(로컬)/GCP Firestore를 무중단으로 갈아끼울 수 있게 했다. 프론트는
      전체(Broad)→그룹(Detail)→단계(Step)→스윔레인 통합(Full) 4단계 드릴다운 뷰를 제공해 경영진
      보고와 실무 인수인계를 같은 데이터로 지원하고, 자동 배치가 못 푸는 예외는 드래그 편집 +
      Undo + 저장 이력(최근 20개)으로 사람이 보정할 수 있게 했다. GCP Cloud Run + Firestore로
      배포해 팀 전체가 실시간으로 최신 흐름을 확인할 수 있게 했으며, 이후 신입사원 교육용 슬랙봇
      연계의 데이터 기반으로 확장할 계획. 배포 과정에서는 서비스 계정 IAM 권한 누락으로 저장소가
      조용히 로컬 파일로 폴백되며 데이터가 유실되는 장애를 겪었고, 그 원인 분석·재발 방지 과정도
      별도로 기록해뒀다.
    tags: [Node.js, Express, TypeScript, React, "ReactFlow", "Google Cloud", Firestore, "Cloud Run"]
    url: "/posts/docx-process-flowchart-elt/"

