<!-- Ambient particle/node network background -->
<script defer src="{{ '/assets/js/particle-network.js' | relative_url }}"></script>

<!-- Interactive résumé: terminal typing intro + scroll-revealed timeline -->
<script defer src="{{ '/assets/js/resume-interactive.js' | relative_url }}"></script>

<!-- Sidebar ASCII clock + calendar -->
<script defer src="{{ '/assets/js/ascii-clock.js' | relative_url }}"></script>

<!-- Real category post-counts, read by cyberpunk-mode.js to draw the
     horizon as a data skyline instead of a flat generic line -->
<script>
  window.__blogSkyline = {
    categories: [
      {% for category in site.categories %}{ "name": {{ category[0] | jsonify }}, "count": {{ category[1].size }} }{% unless forloop.last %},{% endunless %}{% endfor %}
    ]
  };
</script>

<!-- Cyberpunk mode: unlocked by winning the RSS dino game -->
<script defer src="{{ '/assets/js/cyberpunk-mode.js' | relative_url }}"></script>
